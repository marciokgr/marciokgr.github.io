name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish site to docs/
        run: |
          rm -rf docs
          mkdir docs
          cp -r dist/portfolio/browser/. docs/
          touch docs/.nojekyll

      - name: Commit docs for GitHub Pages
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: publish site to docs [skip ci]'
          file_pattern: docs/**
          skip_dirty_check: false

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
