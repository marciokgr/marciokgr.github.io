name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Evita loop infinito quando o próprio workflow publica os arquivos estáticos
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish static site to repo root and docs/
        run: |
          rm -rf docs assets pt-br en es
          rm -f index.html index.csr.html 404.html .nojekyll favicon.ico robots.txt sitemap.xml
          rm -f main-*.js polyfills-*.js styles-*.css chunk-*.js

          mkdir docs
          cp -r dist/portfolio/browser/. docs/
          touch docs/.nojekyll

          # Raiz da main: necessário quando Pages está em main / (root)
          cp -r dist/portfolio/browser/. ./
          touch .nojekyll

      - name: Commit published site
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: publish static site [skip ci]'
          file_pattern: |
            docs/**
            assets/**
            pt-br/**
            en/**
            es/**
            index.html
            index.csr.html
            404.html
            .nojekyll
            favicon.ico
            robots.txt
            sitemap.xml
            main-*.js
            polyfills-*.js
            styles-*.css
            chunk-*.js

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
